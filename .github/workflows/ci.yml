name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run tests
        run: cargo test -p longfred-proto --target x86_64-unknown-linux-gnu

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: clippy (proto, host)
        run: |
          # Workspace lints apply `clippy::all = deny` and `pedantic = warn`.
          # `missing_docs` is warn-by-policy (CODING-GUIDELINES §12.2); pre-existing
          # gaps are tracked separately and must not block this PR.
          cargo clippy -p longfred-proto --target x86_64-unknown-linux-gnu -- \
            -A rustdoc::missing_docs -A missing_docs

  clippy:
    name: Clippy firmware (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: longfred-standard
            features: variant-longfred-standard
          - variant: longfred-mini
            features: variant-longfred-mini
          - variant: markwtech
            features: variant-markwtech,print-auto
          - variant: markwtech-v1-1
            features: variant-markwtech-v1-1
          - variant: heiko-wifred
            features: variant-heiko-wifred
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: clippy
          rust-src: true

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: clippy-${{ matrix.variant }}

      - name: Clippy
        run: |
          # Workspace lints apply `clippy::all = deny` and `pedantic = warn`.
          # `missing_docs` is warn-by-policy (CODING-GUIDELINES §12.2); pre-existing
          # gaps are tracked separately and must not block this PR.
          cargo clippy -p longfred-firmware --no-default-features \
            --features "${{ matrix.features }}" -- \
            -A rustdoc::missing_docs -A missing_docs

  build:
    name: Build firmware (${{ matrix.variant }})
    needs: clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: longfred-standard
            features: variant-longfred-standard
          - variant: longfred-mini
            features: variant-longfred-mini
          - variant: markwtech
            features: variant-markwtech,print-auto
          - variant: markwtech-v1-1
            features: variant-markwtech-v1-1
          - variant: heiko-wifred
            features: variant-heiko-wifred
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: rust-src

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.variant }}

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.5.0

      - name: Build firmware
        run: |
          set -euo pipefail
          VARIANT="${{ matrix.variant }}"
          FEATURES="${{ matrix.features }}"
          cargo build -p longfred-firmware --release --bin longfred \
            --no-default-features --features "${FEATURES}"
          mkdir -p dist

          ELF="target/riscv32imac-unknown-none-elf/release/longfred"
          cp "$ELF" "dist/longfred-${VARIANT}-esp32c6.elf"
          espflash save-image --chip esp32c6 --partition-table partitions.csv --merge "$ELF" \
            "dist/longfred-${VARIANT}-esp32c6.bin"
          espflash save-image --chip esp32c6 --partition-table partitions.csv "$ELF" \
            "dist/longfred-${VARIANT}-esp32c6.app.bin"

          (
            cd dist
            sha256sum "longfred-${VARIANT}-esp32c6.elf" \
              "longfred-${VARIANT}-esp32c6.bin" \
              "longfred-${VARIANT}-esp32c6.app.bin" > SHA256SUMS
          )

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  size-check:
    name: Check ESP32-C6 size
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.5.0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifact-download

      - name: Stage ELFs into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          for variant in longfred-standard longfred-mini markwtech markwtech-v1-1 heiko-wifred; do
            src="artifact-download/firmware-${variant}/longfred-${variant}-esp32c6.elf"
            dst="dist/longfred-${variant}-esp32c6.elf"
            if [[ ! -f "$src" ]]; then
              echo "error: missing artifact ELF: $src" >&2
              ls -laR artifact-download >&2 || true
              exit 1
            fi
            cp -f "$src" "$dst"
            echo "staged $dst"
          done

      - name: Check flash/RAM budget
        run: ./scripts/check-esp32c6-size.sh --check-only
