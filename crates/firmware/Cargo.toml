[package]
name = "longfred-firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "longfred"
path = "src/bin/main.rs"

[features]
default = ["variant-longfred-standard"]
# Hardware variants (mutually exclusive — see board/variants).
# `print-auto` is UART-or-JTAG. MarkWTech v1.0 adds it explicitly (cannot nest
# it in `variant-markwtech` because v1.1 would then enable both print backends).
variant-longfred-standard = ["print-auto"]
variant-longfred-mini = ["print-auto"]
variant-markwtech = []
# TinyC6 pin map; implies variant-markwtech. Logging is USB Serial/JTAG only
# because UART0 (GPIO 16/17) is used for extra buttons.
variant-markwtech-v1-1 = ["variant-markwtech", "print-jtag"]
variant-heiko-wifred = ["print-auto"]
print-auto = ["esp-println/auto"]
print-jtag = ["esp-println/jtag-serial"]

[dependencies]
longfred-proto = { path = "../proto" }
longfred-ui = { path = "../ui" }

esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32c6", "log-04", "esp-radio"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32c6", "wifi", "log-04", "unstable"] }
esp-alloc = "0.10"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
embedded-storage = "0.3"
esp-println = { version = "0.17.0", default-features = false, features = ["esp32c6", "log-04", "colors", "critical-section"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["dhcpv4", "dhcpv4-hostname", "tcp", "udp", "dns", "medium-ethernet", "proto-ipv4", "multicast", "log", "auto-icmp-echo-reply", "icmp"] }
smoltcp = { version = "0.13", default-features = false }
embassy-sync = { version = "0.8", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }

ssd1306 = { version = "0.10", default-features = false, features = ["graphics"] }
embedded-graphics = "0.8"
embedded-hal = "1.0"
embassy-embedded-hal = "0.6"

log = "0.4"
heapless = "0.9"
nb = "1.1"
static_cell = "2.1"
esp-hal-dhcp-server = { version = "0.4.0", default-features = false, features = ["log"] }
embedded-hal-async = "1.0"
critical-section = "1.2"
