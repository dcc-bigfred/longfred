<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LongFred Pairing</title>
<style>
*{box-sizing:border-box}body{font:14px/1.4 system-ui,sans-serif;margin:0;padding:12px;background:#1a1a1a;color:#eee;max-width:480px}
h1{font-size:1.2rem;margin:0 0 12px}label{display:block;margin:10px 0 4px;color:#bbb;font-size:12px}
input,select,textarea{width:100%;padding:8px;border:1px solid #444;border-radius:4px;background:#111;color:#eee}
textarea{min-height:72px;font:12px/1.3 ui-monospace,monospace}row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{flex:1;min-width:90px;padding:10px;border:0;border-radius:4px;background:#2d6cdf;color:#fff;font-weight:600}
button.sec{background:#444}button.danger{background:#a33}#status{margin-top:12px;min-height:1.2em;color:#8f8}
.err{color:#f88!important}.ok{color:#8f8}
fieldset{border:1px solid #333;border-radius:6px;margin:0 0 12px;padding:8px 10px 12px}
legend{padding:0 4px;color:#9cf;font-size:12px}
</style>
</head>
<body>
<h1>LongFred pairing</h1>
<form id="f" onsubmit="return false">
<fieldset>
<legend>BigFred</legend>
<label>Login</label><input id="login" autocomplete="username">
<label>PIN</label><input id="pin" type="text" autocomplete="current-password">
<label>Pairing code (6 digits)</label><input id="pairing_code" inputmode="numeric" maxlength="6" autocomplete="off">
</fieldset>
<fieldset>
<legend>Wi‑Fi</legend>
<label>SSID</label><input id="ssid" autocomplete="off">
<label>Password</label><input id="wifi_pw" type="text" autocomplete="new-password">
</fieldset>
<fieldset>
<legend>Roster</legend>
<label>Mode</label>
<select id="roster_mode"><option value="auto">auto</option><option value="static">static</option><option value="address">address</option></select>
<label>Entries (addr[,name] per line)</label>
<textarea id="roster" placeholder="L1234,Pacific&#10;S99"></textarea>
</fieldset>
<fieldset>
<legend>Firmware</legend>
<label>App image (.app.bin, not merged flash dump)</label>
<input id="fw" type="file" accept=".bin,.app.bin,application/octet-stream">
<row>
<button type="button" onclick="uploadFw()">Upload firmware</button>
</row>
</fieldset>
<fieldset>
<legend>Radio</legend>
<label><input type="checkbox" id="ro_roam"> Roaming</label>
<label><input type="checkbox" id="ro_rrm"> 802.11k (RRM)</label>
<label><input type="checkbox" id="ro_btm"> 802.11v (BTM)</label>
<label><input type="checkbox" id="ro_ft"> 802.11r (FT)</label>
<label><input type="checkbox" id="ro_energy"> Energy saving</label>
<label><input type="checkbox" id="ro_11ax" checked> 802.11ax (OFDMA)</label>
<label><input type="checkbox" id="ro_ip_pin" checked> IP pinning</label>
<label>RSSI threshold (-dBm) <input type="number" id="ro_rssi" value="72" min="50" max="90"></label>
<label>Hysteresis (dB) <input type="number" id="ro_hyst" value="8" min="3" max="20"></label>
<label>Debounce (samples) <input type="number" id="ro_debounce" value="3" min="1" max="10"></label>
<label>Scan interval (s) <input type="number" id="ro_scan_int" value="10" min="1" max="60"></label>
<label>Sample period (ms) <input type="number" id="ro_sample_ms" value="250" min="100" max="2000"></label>
<label>Pin gap (s) <input type="number" id="ro_pin_gap" value="120" min="5" max="3600"></label>
<label>DHCP discover timeout (s) <input type="number" id="ro_dhcp_to" value="2" min="1" max="30"></label>
</fieldset>
<row>
<button type="button" class="sec" onclick="load()">Load</button>
<button type="button" onclick="save()">Save</button>
<button type="button" class="danger" onclick="exitMode()">Exit</button>
</row>
</form>
<p id="status"></p>
<script>
const $=id=>document.getElementById(id);
function status(m,ok){const e=$('status');e.textContent=m;e.className=ok===false?'err':ok?'ok':'';}
function rosterText(entries){
  return (entries||[]).map(e=>e.name?e.addr+','+e.name:e.addr).join('\n');
}
function parseRoster(t){
  return t.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf(',');
    if(i<0)return{addr:l};
    return{addr:l.slice(0,i).trim(),name:l.slice(i+1).trim()||undefined};
  });
}
async function load(){
  status('Loading…');
  try{
    const r=await fetch('/api/v1/settings');
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    $('login').value=(j.bigfred&&j.bigfred.login)||'';
    $('pin').value=(j.bigfred&&j.bigfred.pin)||'';
    $('pairing_code').value=(j.bigfred&&j.bigfred.pairingCode)||'';
    $('ssid').value='';
    $('wifi_pw').value=(j.wifi&&j.wifi.password)||'';
    if(j.wifi&&j.wifi.networks&&j.wifi.networks[0])$('ssid').value=j.wifi.networks[0];
    $('roster_mode').value=(j.roster&&j.roster.mode)||'auto';
    $('roster').value=rosterText(j.roster&&j.roster.entries);
    if(j.radio){
      $('ro_roam').checked=!!j.radio.roam_enabled;
      $('ro_rrm').checked=!!j.radio.rrm_enabled;
      $('ro_btm').checked=!!j.radio.btm_enabled;
      $('ro_ft').checked=!!j.radio.ft_enabled;
      $('ro_energy').checked=!j.radio.power_save_off;
      $('ro_11ax').checked=!!j.radio.enable_11ax;
      $('ro_ip_pin').checked=!!j.radio.ip_pinning;
      $('ro_rssi').value=Math.abs(j.radio.roam_rssi_threshold||-72);
      $('ro_hyst').value=j.radio.roam_hysteresis_db||8;
      $('ro_debounce').value=j.radio.roam_debounce_samples||3;
      $('ro_scan_int').value=j.radio.roam_scan_interval_s||10;
      $('ro_sample_ms').value=j.radio.roam_sample_ms||250;
      $('ro_pin_gap').value=j.radio.ip_pin_max_gap_s||120;
      $('ro_dhcp_to').value=j.radio.dhcp_discover_timeout_s||2;
    }
    status('Loaded',true);
  }catch(e){status('Load failed: '+e,false)}
}
async function save(){
  status('Saving…');
  const body={
    bigfred:{login:$('login').value,pin:$('pin').value||undefined,pairingCode:$('pairing_code').value||undefined},
    wifi:{ssid:$('ssid').value||undefined,password:$('wifi_pw').value||undefined},
    roster_mode:$('roster_mode').value,
    roster:parseRoster($('roster').value)
  };
  const r={
    roam_enabled:$('ro_roam').checked,
    rrm_enabled:$('ro_rrm').checked,
    btm_enabled:$('ro_btm').checked,
    ft_enabled:$('ro_ft').checked,
    power_save_off:!$('ro_energy').checked,
    enable_11ax:$('ro_11ax').checked,
    ip_pinning:$('ro_ip_pin').checked
  };
  r.roam_rssi_threshold=-parseInt($('ro_rssi').value||'72',10);
  r.roam_hysteresis_db=parseInt($('ro_hyst').value||'8',10);
  r.roam_debounce_samples=parseInt($('ro_debounce').value||'3',10);
  r.roam_scan_interval_s=parseInt($('ro_scan_int').value||'10',10);
  r.roam_sample_ms=parseInt($('ro_sample_ms').value||'250',10);
  r.ip_pin_max_gap_s=parseInt($('ro_pin_gap').value||'120',10);
  r.dhcp_discover_timeout_s=parseInt($('ro_dhcp_to').value||'2',10);
  if(Object.keys(r).length)body.radio=r;
  if(!body.wifi.ssid)delete body.wifi;
  else if(body.wifi.password===undefined)body.wifi.password='';
  if(!body.bigfred.login&&!body.bigfred.pin&&!body.bigfred.pairingCode)delete body.bigfred;
  try{
    const r=await fetch('/api/v1/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);
    status('Saved',true);
  }catch(e){status('Save failed: '+e,false)}
}
async function exitMode(){
  status('Exiting…');
  try{
    const r=await fetch('/api/v1/programming-mode/off',{method:'POST'});
    if(!r.ok)throw new Error(r.status);
    status('Done — device rebooting',true);
  }catch(e){status('Exit failed: '+e,false)}
}
async function uploadFw(){
  const f=$('fw').files[0];
  if(!f){status('Choose a .app.bin file',false);return;}
  status('Uploading firmware…');
  try{
    const r=await fetch('/api/v1/firmware',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});
    if(!r.ok)throw new Error(await r.text()||r.status);
    status('Firmware written — device rebooting',true);
  }catch(e){status('Upload failed: '+e,false)}
}
load();
</script>
</body>
</html>
