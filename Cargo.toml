[workspace]
resolver = "3"
members = ["crates/firmware", "crates/proto", "crates/ui"]
default-members = ["crates/proto", "crates/ui"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
# esp-hal peripheral ownership transfer requires `unsafe` blocks; the policy
# is `warn` so HAL integration compiles while new `unsafe` outside HAL modules
# stays visible in review. New `unsafe` must include a `SAFETY:` justification.
unsafe_code = "warn"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.dev.package.esp-radio]
opt-level = 3

[profile.dev.package.esp-storage]
opt-level = 3
