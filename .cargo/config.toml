# Cross-compile firmware from workspace root; host tests: cargo test -p longfred-proto --target HOST
include = ["../crates/firmware/.cargo/esp-config.toml"]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6 --flash-size 8mb --partition-table partitions.csv"

[build]
target = "riscv32imac-unknown-none-elf"
rustflags = ["-C", "force-frame-pointers"]

[unstable]
build-std = ["core"]

[alias]
test-host = ["test", "--target", "x86_64-unknown-linux-gnu"]
